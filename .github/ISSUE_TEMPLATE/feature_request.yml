name: 功能建议
description: 想要新的运维能力、验证项或排错手段
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前可以先翻翻已有的 Issue，并确认
        [docs/TOOLS.md](https://github.com/MVennn/WindowsRemoteOps/blob/main/docs/TOOLS.md)
        与 [docs/ARCHITECTURE.md](https://github.com/MVennn/WindowsRemoteOps/blob/main/docs/ARCHITECTURE.md)
        里没有现成工具或明确不做的事项。

  - type: textarea
    id: scenario
    attributes:
      label: 什么场景不顺手
      description: |
        先说场景再说想法——「想做什么事，现在要手工走哪几步，哪一步最容易漏」。
      placeholder: |
        例：
        目标机重启后 IP 变了，现在只能人工去路由器上查，
        想要一个能提前发现「配置里的地址已经失效」的只读检查。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果（可选）
      description: 希望新增脚本、扩展现有参数，还是只补文档判据？
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议遵守「能用系统自带的就别装第三方，要改的只做最小化改动」，不引入第三方常驻服务、不做端口转发、不接管图形界面。
          required: true
        - label: 我知悉脚本需要真机验证，愿意在自己的机器上配合验证。
          required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 相关命令、日志片段、Windows 版本等；敏感值先脱敏
    validations:
      required: false
