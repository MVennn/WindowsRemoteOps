name: 问题反馈（Bug）
description: 开通脚本跑不通、验证项对不上、连接异常
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把下面的信息填全，尤其是**执行的完整命令与输出原文**——
        同一个报错可能来自防火墙、公钥文件位置、ACL 或服务状态，只有原文才分得清。

        反馈前先查 [docs/TROUBLESHOOTING.md](https://github.com/MVennn/WindowsRemoteOps/blob/main/docs/TROUBLESHOOTING.md)
        与 [docs/PITFALLS.md](https://github.com/MVennn/WindowsRemoteOps/blob/main/docs/PITFALLS.md)。

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: 反馈前确认
      options:
        - label: 我已知悉 `host/bootstrap-openssh.ps1` 会改目标机的系统状态（安装可选功能、改服务启动类型、加防火墙规则、写授权文件），并已了解如何撤销。
          required: true
        - label: 我已把主机地址、用户名、计算机名、MAC 与公钥内容抹掉，替换成 `<HOST-IP>` / `<HOST-USER>` / `<REDACTED-...>`。
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 出了什么问题
      description: |
        现象 + 复现步骤：在哪个环节、预期结果与实际结果分别是什么。
      placeholder: |
        例：
        1. 在目标机执行 bootstrap-openssh.ps1 -PublicKeyFile id_ed25519.pub
        2. 脚本报「File does not look like an OpenSSH public key」
        3. 预期：正常写入；实际：直接退出
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 目标机 Windows 版本
      description: 在目标机执行 `winver`，把版本号贴在这里
      placeholder: "例：Windows 11 23H2 (22631.4169)"
    validations:
      required: true

  - type: input
    id: account
    attributes:
      label: 登录账户类型
      description: 在目标机执行 `whoami` 与 `net localgroup administrators`；**只写「管理员 / 标准用户」，不要贴真实用户名**
      placeholder: "例：管理员账户"
    validations:
      required: true

  - type: input
    id: script
    attributes:
      label: 执行的脚本与完整命令
      description: 参数照抄，公钥内容不要贴
      placeholder: "例：powershell -ExecutionPolicy Bypass -File .\\bootstrap-openssh.ps1 -PublicKeyFile .\\id_ed25519.pub"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 输出 / 报错原文
      description: 把命令输出整段贴进来，不要只截一行；贴前先脱敏
      render: shell
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: verify-host.py 的结果（可选）
      description: 在操作机跑 `python tools/verify-host.py --conf host/host.conf`，把四项结果贴上来（地址打码）
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息（可选）
    validations:
      required: false
